name: Custom Tasmota Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Compatible PlatformIO & SCons
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==6.1.18" "scons==4.7.0"

      - name: Direct Configuration Injection
        run: |
          # Dopisujemy definicje bezpośrednio na samej górze my_user_config.h
          cat << 'EOF' > tasmota/my_user_config_custom.h
          #ifndef CUSTOM_HVAC_CONFIG
          #define CUSTOM_HVAC_CONFIG
          #define FRIENDLY_NAME "Tasmota-HVAC-Custom"
          #define USE_DS18X20
          #define USE_IR_REMOTE_FULL
          #endif
          EOF

          cat tasmota/my_user_config.h >> tasmota/my_user_config_custom.h
          mv tasmota/my_user_config_custom.h tasmota/my_user_config.h

      - name: Build Tasmota Firmware
        run: |
          platformio run -e tasmota

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota-custom
          path: .pio/build/tasmota/firmware.bin
