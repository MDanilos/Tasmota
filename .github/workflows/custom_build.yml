name: Custom Tasmota Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run TasmoCompiler Engine
        run: |
          cp tasmota/user_config_override_sample.h tasmota/user_config_override.h || true
          docker run --rm -v ${{ github.workspace }}:/tasmota -w /tasmota blakadder/tasmo-compiler:latest \
            /bin/bash -c "platformio run -e tasmota"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota-custom
          path: .pio/build/tasmota/firmware.bin
