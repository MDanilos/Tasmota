name: Custom Tasmota Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Specific PlatformIO Version
        run: |
          python -m pip install --upgrade pip
          pip install "platformio==6.1.16" "scons<4.8.0"

      - name: Copy override header
        run: |
          cp user_config_override.h tasmota/user_config_override.h || true

      - name: Build Tasmota Firmware
        run: |
          platformio run -e tasmota

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tasmota-custom
          path: .pio/build/tasmota/firmware.bin
